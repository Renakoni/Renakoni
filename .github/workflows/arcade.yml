name: Contribution Breakout

on:
  schedule:
    - cron: "15 3 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate contribution games
        run: |
          mkdir -p .arcade-build
          npx --yes pacman-contribution-graph@5.3.1 --game breakout --username Renakoni --platform github --gameTheme github --output .arcade-build/breakout.svg
          npx --yes pacman-contribution-graph@5.3.1 --game breakout --username Renakoni --platform github --gameTheme github-dark --output .arcade-build/breakout-dark.svg
          node style-arcade.js light .arcade-build/breakout.svg assets/arcade-light.svg
          node style-arcade.js dark .arcade-build/breakout-dark.svg assets/arcade-dark.svg
          rm -r .arcade-build

      - name: Commit SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/arcade-light.svg assets/arcade-dark.svg
          git commit -m "chore: update contribution breakout [skip ci]" || echo "No changes to commit"
          git push
