name: Contribution Breakout

on:
  schedule:
    - cron: "15 3 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate authenticated contribution games
        uses: abozanona/pacman-contribution-graph@7332e1de7903ab780c3692a4127a59cc13872daa
        with:
          github_user_name: Renakoni
          github_token: ${{ secrets.METRICS_TOKEN }}
          games: breakout

      - name: Style contribution games
        run: |
          node style-arcade.js light dist/breakout-contribution-graph.svg assets/arcade-light.svg
          node style-arcade.js dark dist/breakout-contribution-graph-dark.svg assets/arcade-dark.svg
          rm -r dist

      - name: Commit SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/arcade-light.svg assets/arcade-dark.svg
          git commit -m "chore: update contribution breakout [skip ci]" || echo "No changes to commit"
          git push
